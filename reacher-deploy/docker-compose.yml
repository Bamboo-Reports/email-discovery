# Reacher backend on the VPS, reached via your existing Cloudflare Tunnel.
# Reacher binds to localhost only; cloudflared forwards a public hostname to it
# and handles TLS at Cloudflare's edge — no inbound ports on the VPS.
# Vercel calls https://<tunnel-hostname>/v0/check_email with the x-reacher-secret header.
#
# Usage on the VPS:
#   cp .env.example .env   # then fill in real values
#   docker compose up -d
# Then in Cloudflare Zero Trust > Tunnels, add a public hostname route:
#   <tunnel-hostname>  ->  http://localhost:8080
services:
  reacher:
    image: reacherhq/backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"        # localhost only; cloudflared reaches it here
    environment:
      RCH__HTTP_HOST: "0.0.0.0"
      RCH__HEADER_SECRET: "${RCH__HEADER_SECRET}"
      # SMTP probing goes through the SOCKS5 proxy (VPS has no port 25).
      RCH__PROXY__HOST: "${RCH__PROXY__HOST}"
      RCH__PROXY__PORT: "${RCH__PROXY__PORT}"
      RCH__PROXY__USERNAME: "${RCH__PROXY__USERNAME}"
      RCH__PROXY__PASSWORD: "${RCH__PROXY__PASSWORD}"
      # Identity used in the SMTP conversation — use your real domain.
      RCH__FROM_EMAIL: "${RCH__FROM_EMAIL}"
      RCH__HELLO_NAME: "${RCH__HELLO_NAME}"
